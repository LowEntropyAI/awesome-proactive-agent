400">Home</text><g transform="translate(474 182) scale(1.4166666666666667)" fill="none" stroke="#bad7cb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8M2 14h2M20 14h2M15 13v2M9 13v2"/><rect width="16" height="12" x="4" y="8" rx="2"/></g><text x="491" y="244" font-size="18" fill="#b8cec4" text-anchor="middle" font-weight="400">Robots</text><path d="M300 267V294" fill="none" stroke="#77958b" stroke-width="2" marker-end="url(#arrow)"/><g id="personal-context" transform="translate(300 432)"><circle r="119" fill="none" stroke="#45665a" stroke-dasharray="3 8"/><circle r="104" fill="#c5e8d4"/><g transform="translate(-24 -77) scale(2)" fill="none" stroke="#214436" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></g><text x="0" y="0" font-size="25" fill="#173b2d" text-anchor="middle" font-weight="600">Understand you</text><text x="0" y="33" font-size="18" fill="#315546" text-anchor="middle" font-weight="400">Goals · preferences</text><text x="0" y="59" font-size="17" fill="#315546" text-anchor="middle" font-weight="400">Routines · boundaries</text></g><text x="300" y="582" font-size="20" fill="#b8cec4" text-anchor="middle" font-weight="400">Memory + feedback</text><path d="M300 603V635" fill="none" stroke="#77958b" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="673" font-size="23" fill="#f4f3e9" text-anchor="middle" font-weight="600">Decide: benefit, timing, consent</text><path d="M300 690V710H153V733" fill="none" stroke="#77958b" stroke-width="2" marker-end="url(#arrow)"/><path d="M300 710H447V733" fill="none" stroke="#77958b" stroke-width="2" marker-end="url(#arrow)"/><g id="intervention" transform="translate(26 745)"><rect width="260" height="88" rx="16" fill="#f0c29a" stroke="#f0c29a"/><g transform="translate(18 19) scale(1.25)" fill="none" stroke="#3c3026" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.