<svg xmlns="http://www.w3.org/2000/svg" width="600" height="960" viewBox="0 0 600 960" role="img" aria-labelledby="title desc"><title id="title">Proactive AI: Anticipate Needs. Take Initiative.</title><desc id="desc">An outreach overview, not a fixed architecture: understand context, anticipate needs, prepare and plan, communicate and collaborate, act with permission, adapt and exercise restraint. Personal understanding, memory and feedback are among many capabilities. Across work, mobile, wearables, home and robots.</desc><defs><radialGradient id="lilac"><stop stop-color="#c6b9ed" stop-opacity=".7"/><stop offset="1" stop-color="#c6b9ed" stop-opacity="0"/></radialGradient><radialGradient id="mint"><stop stop-color="#b2e1d4" stop-opacity=".65"/><stop offset="1" stop-color="#b2e1d4" stop-opacity="0"/></radialGradient><radialGradient id="blue"><stop stop-color="#afcfee" stop-opacity=".65"/><stop offset="1" stop-color="#afcfee" stop-opacity="0"/></radialGradient><clipPath id="frame"><rect width="600" height="960" rx="26"/></clipPath></defs><g clip-path="url(#frame)"><rect width="600" height="960" fill="#f3f5fa"/><ellipse cx="480" cy="172.79999999999998" rx="312" ry="624" fill="url(#lilac)"/><ellipse cx="120" cy="720" rx="360" ry="624" fill="url(#mint)"/><ellipse cx="510" cy="912" rx="300" ry="576" fill="url(#blue)"/></g><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="30" y="53" font-size="16" fill="#596f87" font-weight="600">Proactive AI</text><text x="30" y="106" font-size="38" fill="#26344b" font-weight="600">Anticipate Needs.</text><text x="30" y="153" font-size="38" fill="#26344b" font-weight="600">Take Initiative.</text><text x="30" y="192" font-size="19" fill="#48566c" font-weight="400">Useful help, with judgment and boundaries.</text><g id="capability-0" transform="translate(26 226)"><rect width="268" height="160" rx="18" fill="#fff" fill-opacity=".72" stroke="#fff" stroke-opacity=".95"/><circle cx="24" cy="26" r="4" fill=