<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc"><title id="title">Proactive AI: Anticipate Needs. Take Initiative.</title><desc id="desc">An outreach overview, not a fixed architecture: understand context, anticipate needs, prepare and plan, communicate and collaborate, act with permission, adapt and exercise restraint. Personal understanding, memory and feedback are among many capabilities. Across work, mobile, wearables, home and robots.</desc><defs><radialGradient id="lilac"><stop stop-color="#c6b9ed" stop-opacity=".7"/><stop offset="1" stop-color="#c6b9ed" stop-opacity="0"/></radialGradient><radialGradient id="mint"><stop stop-color="#b2e1d4" stop-opacity=".65"/><stop offset="1" stop-color="#b2e1d4" stop-opacity="0"/></radialGradient><radialGradient id="blue"><stop stop-color="#afcfee" stop-opacity=".65"/><stop offset="1" stop-color="#afcfee" stop-opacity="0"/></radialGradient><clipPath id="frame"><rect width="1120" height="620" rx="26"/></clipPath></defs><g clip-path="url(#frame)"><rect width="1120" height="620" fill="#f3f5fa"/><ellipse cx="896" cy="111.6" rx="582.4" ry="403" fill="url(#lilac)"/><ellipse cx="224" cy="465" rx="672" ry="403" fill="url(#mint)"/><ellipse cx="952" cy="589" rx="560" ry="372" fill="url(#blue)"/></g><g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><text x="48" y="52" font-size="16" fill="#596f87" font-weight="600">Proactive AI</text><text x="48" y="108" font-size="42" fill="#26344b" font-weight="600">Anticipate Needs. Take Initiative.</text><text x="48" y="148" font-size="21" fill="#48566c" font-weight="400">Useful help is also about what to prepare, propose and do—not only when to speak.</text><g id="capability-0" transform="translate(48 185)"><rect width="328" height="142" rx="18" fill="#fff" fill-opacity=".72" stroke="#fff" stroke-opacity=".95"/><circle cx="24" cy="26" r="4" fill="#798fa9"/><text x="39" y="31" font-size="13" fill="#596f87" font-weight="600">01</text><text x="22" y="63" font-size="23" fill="#243248" font-weight="600">Understand Context</text><text x="22" y="94" font-size="17" fill="#48566c" font-weight="400">Goals, People &amp; Environments</text><text x="22" y="119" font-size="14" fill="#48566c" font-weight="400">Context is more than a prompt.</text></g><g id="capability-1" transform="translate(396 185)"><rect width="328" height="142" rx="18" fill="#fff" fill-opacity=".72" stroke="#fff" stroke-opacity=".95"/><circle cx="24" cy="26" r="4" fill="#798fa9"/><text x="39" y="31" font-size="13" fill="#596f87" font-weight="600">02</text><text x="22" y="63" font-size="23" fill="#243248" font-weight="600">Anticipate Needs</text><text x="22" y="94" font-size="17" fill="#48566c" font-weight="400">Opportunities &amp; Emerging Risks</text><text x="22" y="119" font-size="14" fill="#48566c" font-weight="400">Look beyond the next request.</text></g><g id="capability-2" transform="translate(744 185)"><rect width="328" height="142" rx="18" fill="#fff" fill-opacity=".72" stroke="#fff" stroke-opacity=".95"/><circle cx="24" cy="26" r="4" fill="#798fa9"/><text x="39" y="31" font-size="13" fill="#596f87" font-weight="600">03</text><text x="22" y="63" font-size="23" fill="#243248" font-weight="600">Prepare &amp; Plan</text><text x="22" y="94" font-size="17" fill="#48566c" font-weight="400">Next Steps &amp; Useful Preparation</text><text x="22" y="119" font-size="14" fill="#48566c" font-weight="400">Help can begin before action.</text></g><g id="capability-3" transform="translate(48 343)"><rect width="328" height="142" rx="18" fill="#fff" fill-opacity=".72" stroke="#fff" stroke-opacity=".95"/><circle cx="24" cy="26" r="4" fill="#798fa9"/><text x="39" y="31" font-size="13" fill="#596f87" font-weight="600">04</text><text x="22" y="63" font-size="23" fill="#243248" font-weight="600">Communicate &amp; Collaborate</text><text x="22" y="94" font-size="17" fill="#48566c" font-weight="400">Ask, Suggest &amp; Coordinate</text><text x="22" y="119" font-size="14" fill="#48566c" font-weight="400">Resolve uncertainty together.</text></g><g id="capability-4" transform="translate(396 343)"><rect width="328" height="142" rx="18" fill="#fff" fill-opacity=".72" stroke="#fff" stroke-opacity=".95"/><circle cx="24" cy="26" r="4" fill="#798fa9"/><text x="39" y="31" font-size="13" fill="#596f87" font-weight="600">05</text><text x="22" y="63" font-size="23" fill="#243248" font-weight="600">Act With Permission</text><text x="22" y="94" font-size="17" fill="#48566c" font-weight="400">Initiative Within Agreed Bounds</text><text x="22" y="119" font-size="14" fill="#48566c" font-weight="400">Keep people in control.</text></g><g id="capability-5" transform="translate(744 343)"><rect width="328" height="142" rx="18" fill="#fff" fill-opacity=".72" stroke="#fff" stroke-opacity=".95"/><circle cx="24" cy="26" r="4" fill="#798fa9"/><text x="39" y="31" font-size="13" fill="#596f87" font-weight="600">06</text><text x="22" y="63" font-size="23" fill="#243248" font-weight="600">Adapt &amp; Exercise Restraint</text><text x="22" y="94" font-size="17" fill="#48566c" font-weight="400">Memory + Feedback</text><text x="22" y="119" font-size="14" fill="#48566c" font-weight="400">Learn what matters; know when to wait.</text></g><text x="48" y="532" font-size="20" fill="#26344b" font-weight="600">Many Capabilities, Not One Fixed Workflow</text><text x="48" y="570" font-size="18" fill="#48566c" font-weight="400">Work · Mobile · Wearables · Home · Robots</text><text x="555" y="570" font-size="17" fill="#48566c" font-weight="400">Research · Models · Agent Systems · Applications · Evaluation</text></g></svg>
